<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-report column with a sticky contents rail on wide screens; one column on phones. */
:root {
  --bg: #f3f4f6;          /* cool tower stone */
  --surface: #fcfcfb;     /* chart surface */
  --ink: #151821;
  --ink-2: #4a4f5c;
  --muted: #7f8491;
  --line: #dfe1e6;
  --base: #c3c6ce;
  --accent: #6c3a5f;      /* plum: headings, links, the one bold note */
  --accent-wash: #f1e7ee;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --old: #a9adb7;
  --pos: #2a78d6; --neg: #e34948;
  --hot: #e34948; --cold: #2a78d6; --mid: #a9adb7;
  --display: "Alegreya SC", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --t0: #9cc3ef; --t1: #6aa2e4; --t2: #3f80d3; --t3: #6c3a5f; --t4: #8d4b7b; --t5: #b45d96; --t6: #d77cb3;
  --step-0: 1.0625rem; --step-1: 1.3rem; --step-2: 1.7rem; --step-3: 2.4rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --surface: #1a1c22; --ink: #eef0f4; --ink-2: #c3c7d1; --muted: #8b909c; --line: #2b2e36; --base: #3a3d46;
    --accent: #d99cc6; --accent-wash: #2d2029;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --old: #5c616d; --pos: #3987e5; --neg: #e66767; --hot: #e66767; --cold: #3987e5; --mid: #5c616d;
    --t0: #2f5f99; --t1: #3a76bd; --t2: #5b93d8; --t3: #b97aa8; --t4: #cc8fbb; --t5: #dca7cc; --t6: #ecc4de;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1a1c22; --ink: #eef0f4; --ink-2: #c3c7d1; --muted: #8b909c; --line: #2b2e36; --base: #3a3d46;
  --accent: #d99cc6; --accent-wash: #2d2029;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --old: #5c616d; --pos: #3987e5; --neg: #e66767; --hot: #e66767; --cold: #3987e5; --mid: #5c616d;
  --t0: #2f5f99; --t1: #3a76bd; --t2: #5b93d8; --t3: #b97aa8; --t4: #cc8fbb; --t5: #dca7cc; --t6: #ecc4de;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: var(--step-0); line-height: 1.55; }
.page { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px;
  display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; }
@media (max-width: 900px) { .page { grid-template-columns: minmax(0, 1fr); gap: 0; padding-inline: 16px; } nav.toc { display: none; } }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; font-size: 0.95rem; }
nav.toc ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; border-left: 1px solid var(--line); }
nav.toc a { color: var(--ink-2); text-decoration: none; padding-left: 12px; display: block; }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--accent); }
nav.toc .toc-title { font-family: var(--display); color: var(--muted); letter-spacing: 0.06em; margin-bottom: 10px; }

main { min-width: 0; }
header.hero { padding-block: 8px 28px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.eyebrow { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: var(--step-3); line-height: 1.1; margin: 8px 0 12px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: var(--step-2); margin: 0 0 6px; text-wrap: balance; color: var(--accent); }
h3 { font-family: var(--body); font-weight: 700; font-size: var(--step-1); margin: 28px 0 6px; text-wrap: balance; }
p, li { max-width: 68ch; }
.lede { font-size: 1.2rem; color: var(--ink-2); }
a { color: var(--accent); }
section { padding-block: 40px 8px; border-bottom: 1px solid var(--line); }
section:last-of-type { border-bottom: 0; }
.sub { color: var(--ink-2); margin-top: 0; }
code, .mono { font-family: var(--mono); font-size: 0.88em; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.tile .v { font-family: var(--display); font-size: 2rem; line-height: 1.1; }
.tile .k { color: var(--ink-2); font-size: 0.95rem; }

.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 16px 0; min-width: 0; }
.figure figcaption { color: var(--ink-2); font-size: 0.95rem; margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.92rem; color: var(--ink-2); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--body); }
svg.heat { max-width: 640px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--base); stroke-width: 1.5; }
.chart .guide { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .axis-label { fill: var(--muted); font-size: 12px; }
.chart .cat { fill: var(--ink); font-size: 13px; }
.chart .val { fill: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .end-label, .chart .pt-label { fill: var(--ink-2); font-size: 12px; }
.chart .bar-a { fill: var(--old); }
.chart .bar-b { fill: var(--s1); }
.chart .pos { fill: var(--pos); }
.chart .neg { fill: var(--neg); }
.chart .line { fill: none; stroke-width: 2; }
.chart .cross { stroke: var(--base); stroke-width: 1; }
.chart .dot { fill: var(--mid); stroke: var(--surface); stroke-width: 2; }
.chart .dot.hot { fill: var(--hot); }
.chart .dot.cold { fill: var(--cold); }
.chart .heat-cell { fill: var(--s1); }
.chart .heat-none { fill: var(--line); }
.chart .heat-val { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
.chart .heat-val.on-dark { fill: #fff; }
.chart [tabindex]:focus-visible { outline: 2px solid var(--accent); }
.chart rect[tabindex], .chart circle[tabindex] { cursor: default; }

.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; font-size: 0.9rem; max-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.tip strong { font-variant-numeric: tabular-nums; }
.tip .tip-head { font-weight: 700; margin-bottom: 2px; }

.table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
th button { all: unset; cursor: pointer; font-weight: 700; color: var(--ink-2); }
th button:focus-visible { outline: 2px solid var(--accent); }
th[aria-sort="descending"] button::after { content: " ↓"; }
th[aria-sort="ascending"] button::after { content: " ↑"; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td:last-child { min-width: 14ch; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.82rem; border: 1px solid var(--line); white-space: nowrap; }
.chip.underpriced { color: var(--hot); border-color: var(--hot); }
.chip.overpriced { color: var(--cold); border-color: var(--cold); }
.chip.in-line { color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.filters button { font: inherit; font-size: 0.92rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.callout { background: var(--accent-wash); border-radius: 8px; padding: 14px 18px; margin: 18px 0; }
.callout p { margin: 6px 0; }
ol.recs { padding-left: 1.3em; display: grid; gap: 10px; }
ol.recs li::marker { font-family: var(--display); color: var(--accent); }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Pass 3 additions */
.chart .bar-m { fill: var(--s2); }
.muted { color: var(--muted); }
.hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin: 16px 0; }
.hero-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.hero-card h3 { font-family: var(--display); margin: 0; color: var(--accent); }
.hero-card .hp { color: var(--ink-2); font-size: 0.95rem; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.hero-card dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; margin: 0; font-size: 0.93rem; }
.hero-card dt { color: var(--muted); }
.hero-card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.starters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 16px; max-width: 720px; }
@media (max-width: 900px) { .starters { grid-template-columns: minmax(0, 1fr); } }
.starters h4 { font-family: var(--body); font-size: 1.05rem; margin: 18px 0 0; }
.delta-pos { color: var(--pos); }
.delta-neg { color: var(--neg); }

.two { align-items: start; }
.starters td:first-child { white-space: nowrap; }

/* Pass 4 additions */
.chart .whisker { stroke: var(--ink-2); stroke-width: 1.5; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; margin: 16px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; display: grid; gap: 4px; align-content: start; }
.card .name { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 1.1rem; }
.card .meta { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.card .text { color: var(--ink); }
.card .why { color: var(--ink-2); font-size: 0.93rem; }
.chip.new-mech { color: var(--s2); border-color: var(--s2); }
.chip.existing { color: var(--s3); border-color: var(--s3); }

</style><style>
/* Spire Lab template additions: the opening block every lab report starts with. */
.opening { display: grid; gap: 14px; margin-top: 24px; }
.opening .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; }
.opening .panel.verdict { border-left: 4px solid var(--accent); }
.opening .panel.decide { background: var(--accent-wash); border-color: transparent; }
.opening h2 { font-size: var(--step-1); margin-bottom: 4px; }
.opening ol, .opening ul { margin: 6px 0 0; padding-left: 1.3em; display: grid; gap: 6px; }
.opening p { margin: 4px 0; }
.index-table td:first-child { font-family: var(--mono); color: var(--muted); }
</style>
